name: TEMP - Evaluate patched Excel and upload dependencies
on:
  push:
    branches:
      - integration/phase-1a1-base-segura
    paths:
      - .github/workflows/prelaunch-dependency-candidate.yml
permissions:
  contents: read
jobs:
  isolated-dependency-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate dependency lock candidate (no repo writes)
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact --no-audit --no-fund 'xlsx@https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz' 'multer@2.4.0'
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(!p.dependencies.xlsx.includes('xlsx-0.20.3.tgz') || p.dependencies.multer!=='2.4.0' || l.packages[''].dependencies.xlsx!==p.dependencies.xlsx || l.packages[''].dependencies.multer!==p.dependencies.multer) process.exit(1); console.log('candidate validated')"
          npm ci --no-audit --no-fund
      - name: Validate TypeScript and build against patched dependencies
        run: |
          npm run check
          npm run build
      - name: Export reproducible package files for reviewed GitHub commit
        run: |
          echo __CN_PACKAGE_BEGIN__
          base64 -w96 package.json
          echo __CN_PACKAGE_END__
          echo __CN_LOCK_BEGIN__
          base64 -w96 package-lock.json
          echo __CN_LOCK_END__
