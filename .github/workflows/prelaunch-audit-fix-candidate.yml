name: TEMP - Semver-only dependency audit fix evaluation
on:
  push:
    branches:
      - integration/phase-1a1-base-segura
    paths:
      - .github/workflows/prelaunch-audit-fix-candidate.yml
permissions:
  contents: read
jobs:
  isolated-auditfix-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Audit and update compatible lockfile only (no write to repo)
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --json > audit-before.json || true
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm ci --no-audit --no-fund
          npm audit --omit=dev --json > audit-after.json || true
          node -e "for(const [label,file] of [['before','audit-before.json'],['after','audit-after.json']]){const v=require('./'+file).metadata.vulnerabilities;console.log('AUDITFIX_COUNT_'+label.toUpperCase()+'='+JSON.stringify(v))}"
      - name: Validate TypeScript/build and Excel invitation roundtrip
        run: |
          npm run check
          npm run build
          npm test -- --runInBand --coverage=false --forceExit tests/unit/broker-invitation-bulk.test.ts
      - name: Export reproducible candidate to review
        run: |
          echo __CN_AF_PACKAGE_BEGIN__
          base64 -w96 package.json
          echo __CN_AF_PACKAGE_END__
          echo __CN_AF_LOCK_BEGIN__
          base64 -w96 package-lock.json
          echo __CN_AF_LOCK_END__
