name: Credito Negocios - QA prelaunch (isolated)
on:
  push:
    branches:
      - 'fix/prelaunch-p0-gpt6-*'
      - 'integration/phase-1a1-base-segura'
      - 'release/brokers-leasing-clients-20261022'
      - 'feat/onboarding-ayuda-v2-*'
  workflow_dispatch:
concurrency:
  group: prelaunch-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  typescript-build-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      USE_MEMORY_STORAGE: 'true'
      DATABASE_URL: postgresql://local:local@localhost:5432/creditonegocios_test
      SESSION_SECRET: prelaunch-ci-only-not-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run check
      - name: Build
        run: npm run build

  unit-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      NODE_ENV: test
      USE_MEMORY_STORAGE: 'true'
      DATABASE_URL: postgresql://local:local@localhost:5432/creditonegocios_test
      SESSION_SECRET: prelaunch-ci-only-not-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Financial and security regression tests (sharded, complete coverage)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          tests=(
            tests/unit/b2-financial-qa-consolidation.test.ts
            tests/unit/b2-commission-document-validation.test.ts
            tests/unit/commission-gate-security.test.ts
            tests/unit/commission-historical-beneficiary.test.ts
            tests/unit/m1-matching-engine.test.ts
            tests/unit/commercial-terms-current-version.test.ts
            tests/unit/b2-commercial-terms-acceptance.test.ts
            tests/unit/b2-manual-disbursement-validation.test.ts
            tests/unit/b2-financial-integrity-endpoints.test.ts
            tests/unit/offer-lineage-identity.test.ts
            tests/unit/offer-commission-material-delta.test.ts
            tests/unit/offer-commission-acceptance.test.ts
            tests/unit/legal-voucher-pdf.test.ts
            tests/unit/client-consent-release-gate.test.ts
            tests/unit/client-consent-send-atomic.test.ts
            tests/unit/document-storage-staging-isolation.test.ts
            tests/unit/client-consent-revocation-expiry.test.ts
            tests/unit/broker-profile-expediente.test.ts
            tests/unit/m2-m3-matching-regression.test.ts
            tests/unit/prod-hotfix-security.test.ts
            tests/unit/broker-registration-atomicity.test.ts
            tests/unit/invitation-activation-legal.test.ts
            tests/unit/prelaunch-registration-http.test.ts
            tests/unit/legal-registration-block2.test.ts
            tests/unit/broker-formalization-otp-block3b1.test.ts
            tests/unit/broker-formalization-origination-gate.test.ts
            tests/unit/prelaunch-health-schema.test.ts
            tests/unit/annual-income-matching.test.ts
            tests/unit/submission-status-display.test.ts
            tests/unit/dashboard-origin-visibility.test.ts
            tests/unit/client-list-visibility.test.ts
            tests/unit/client-onboarding-ux-postlaunch.test.ts
            tests/unit/user-tour-help-v2.test.ts
            tests/unit/network-transitions-safety.test.ts
            tests/unit/client-credit-origin-list.test.ts
            tests/unit/credit-document-http-authz.test.ts
            tests/unit/credit-response-projection.test.ts
            tests/unit/document-origin-visibility.test.ts
            tests/unit/websocket-session-gate.test.ts
            tests/unit/websocket-session-http.test.ts
            tests/unit/broker-invitation-bulk.test.ts
            tests/unit/broker-invitation-email.test.ts
            tests/unit/broker-invitation-http.test.ts
            tests/unit/rbac.test.ts
            tests/unit/settings-audit-role-ux.test.ts
            tests/unit/broker-legal-ux-postlaunch.test.ts
            tests/unit/admin-legal-evidence-http.test.ts
            tests/unit/mortgage-family-consolidation.test.ts
            tests/unit/leasing-postlaunch.test.ts
          )
          selected=()
          for i in "${!tests[@]}"; do
            if (( i % 4 == SHARD )); then
              selected+=("${tests[$i]}")
            fi
          done
          echo "Running shard ${SHARD}/3: ${#selected[@]} suites"
          npm test -- --runInBand --coverage=false --forceExit "${selected[@]}"


  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: creditonegocios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d creditonegocios_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      USE_MEMORY_STORAGE: 'true'
      TEST_DATABASE_URL: postgresql://ci:ci_only@localhost:5432/creditonegocios_test
      DATABASE_URL: postgresql://ci:ci_only@localhost:5432/creditonegocios_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Isolated PostgreSQL integration suites (sharded)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          tests=(
            tests/integration/postgres-manual-benefits.test.ts
            tests/integration/postgres-client-consent-migration.test.ts
            tests/integration/postgres-client-consent-concurrency.test.ts
            tests/integration/postgres-versioning-migration.test.ts
            tests/integration/postgres-offer-lineage-migration.test.ts
            tests/integration/postgres-network-attribution-migration.test.ts
            tests/integration/postgres-manual-payout.test.ts
            tests/integration/postgres-credit-disbursement.test.ts
            tests/integration/postgres-target-disbursement.test.ts
            tests/integration/postgres-offer-publication-race.test.ts
            tests/integration/postgres-commercial-config-atomic.test.ts
            tests/integration/postgres-network-rates-atomic.test.ts
            tests/integration/postgres-staging-schema-repair.test.ts
          )
          selected=()
          for i in "${!tests[@]}"; do
            if (( i % 4 == SHARD )); then
              selected+=("${tests[$i]}")
            fi
          done
          echo "Isolated PostgreSQL shard ${SHARD}/3: ${#selected[@]} test suites"
          npm test -- --runInBand --coverage=false --forceExit "${selected[@]}"

  staging-public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public Staging health and anonymous access checks
        run: node scripts/smoke-staging-public.cjs

  production-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit runtime dependencies only
        run: npm audit --omit=dev --json > audit-production.json || true
      - name: Gate on CRITICAL production runtime advisories
        run: node scripts/prelaunch-dependency-audit.cjs audit-production.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-dependency-audit
          path: audit-production.json
          retention-days: 14
