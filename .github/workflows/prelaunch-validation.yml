name: Credito Negocios - QA prelaunch (isolated)
on:
  push:
    branches:
      - 'fix/prelaunch-p0-gpt6-*'
      - 'integration/phase-1a1-base-segura'
  workflow_dispatch:
concurrency:
  group: prelaunch-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  typescript-build-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      USE_MEMORY_STORAGE: 'true'
      DATABASE_URL: postgresql://local:local@localhost:5432/creditonegocios_test
      SESSION_SECRET: prelaunch-ci-only-not-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run check
      - name: Build
        run: npm run build
      - name: Financial P0 regression tests (MemStorage only)
        run: npm test -- --runInBand --coverage=false --forceExit tests/unit/b2-financial-qa-consolidation.test.ts tests/unit/b2-commission-document-validation.test.ts tests/unit/commission-gate-security.test.ts tests/unit/commission-historical-beneficiary.test.ts tests/unit/m1-matching-engine.test.ts tests/unit/commercial-terms-current-version.test.ts tests/unit/b2-commercial-terms-acceptance.test.ts tests/unit/b2-manual-disbursement-validation.test.ts tests/unit/b2-financial-integrity-endpoints.test.ts tests/unit/offer-lineage-identity.test.ts tests/unit/offer-commission-material-delta.test.ts tests/unit/offer-commission-acceptance.test.ts tests/unit/legal-voucher-pdf.test.ts tests/unit/client-consent-release-gate.test.ts tests/unit/client-consent-send-atomic.test.ts tests/unit/client-consent-revocation-expiry.test.ts tests/unit/broker-profile-expediente.test.ts tests/unit/m2-m3-matching-regression.test.ts tests/unit/prod-hotfix-security.test.ts tests/unit/broker-registration-atomicity.test.ts tests/unit/invitation-activation-legal.test.ts tests/unit/prelaunch-registration-http.test.ts tests/unit/legal-registration-block2.test.ts tests/unit/broker-formalization-otp-block3b1.test.ts tests/unit/broker-formalization-origination-gate.test.ts tests/unit/network-transitions-safety.test.ts tests/unit/rbac.test.ts

  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: creditonegocios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d creditonegocios_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      USE_MEMORY_STORAGE: 'true'
      TEST_DATABASE_URL: postgresql://ci:ci_only@localhost:5432/creditonegocios_test
      DATABASE_URL: postgresql://ci:ci_only@localhost:5432/creditonegocios_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test LEG-10 customer consent evidence schema and immutability in isolated PostgreSQL
        run: npm test -- --runInBand --coverage=false --forceExit tests/integration/postgres-client-consent-migration.test.ts
      - name: Test LEG-10 concurrent revocation vs send against real isolated PostgreSQL
        run: npm test -- --runInBand --coverage=false --forceExit tests/integration/postgres-client-consent-concurrency.test.ts
      - name: Test isolated PostgreSQL migration 0005
        run: npm test -- --runInBand --coverage=false --forceExit tests/integration/postgres-versioning-migration.test.ts
      - name: Test isolated PostgreSQL canonical lineage migration 0009
        run: npm test -- --runInBand --coverage=false --forceExit tests/integration/postgres-offer-lineage-migration.test.ts
      - name: Test historical Master attribution migration 0004
        run: npm test -- --runInBand --coverage=false --forceExit tests/integration/postgres-network-attribution-migration.test.ts
      - name: Test atomic manual commission settlement in isolated PostgreSQL
        run: npm test -- --runInBand --coverage=false --forceExit tests/integration/postgres-manual-payout.test.ts
      - name: Test atomic credit disbursements and concurrent partialities in isolated PostgreSQL
        run: npm test -- --runInBand --coverage=false --forceExit tests/integration/postgres-credit-disbursement.test.ts
      - name: Test winner-target atomic creation, linkage, rollback and lineage in PostgreSQL
        run: npm test -- --runInBand --coverage=false --forceExit tests/integration/postgres-target-disbursement.test.ts
      - name: Test concurrent offer draft edits versus immutable PostgreSQL publication
        run: npm test -- --runInBand --coverage=false --forceExit tests/integration/postgres-offer-publication-race.test.ts
      - name: Test commercial configuration, legal publication and audits as one PostgreSQL transaction
        run: npm test -- --runInBand --coverage=false --forceExit tests/integration/postgres-commercial-config-atomic.test.ts
      - name: Test Master Broker rate version atomicity and concurrency in PostgreSQL
        run: npm test -- --runInBand --coverage=false --forceExit tests/integration/postgres-network-rates-atomic.test.ts
